version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rgngdnk", email = "225964264+rgngdnk@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.139.2",
    "httpx>=0.28.1",
